    </section>
  </main>

    const marcaSelect = document.getElementById('marca');
    const modeloSelect = document.getElementById('modelo');
    const detalhesDiv = document.getElementById('detalhes');
    const familiaSpan = document.getElementById('familia');
    const modeloSpan = document.getElementById('modeloFinal');

    // Preenche as opções de marcas no select
    function preencherMarcas() {
      Object.keys(data).forEach(marca => {
        const option = document.createElement('option');
        option.value = marca;
        option.textContent = marca;
        marcaSelect.appendChild(option);
      });
    }

    // Atualiza a lista de modelos ao selecionar uma marca
    function atualizarModelos() {
      const marcaSelecionada = marcaSelect.value;
      modeloSelect.innerHTML = '<option value="" disabled selected>Selecione o modelo</option>';
      detalhesDiv.classList.add('hidden');
      familiaSpan.textContent = '';
      modeloSpan.textContent = '';
      modeloSelect.disabled = true;

      if (!marcaSelecionada || !data[marcaSelecionada]) return;

      data[marcaSelecionada].forEach(item => {
        const option = document.createElement('option');
        option.value = `${item.familia}|${item.modelo}`;
        option.textContent = item.familia;
        modeloSelect.appendChild(option);
      });
      modeloSelect.disabled = false;
    }

    // Exibe os detalhes do modelo selecionado
    function mostrarDetalhes() {
      const selectedValue = modeloSelect.value;
      if (!selectedValue) {
        detalhesDiv.classList.add('hidden');
        familiaSpan.textContent = '';
        modeloSpan.textContent = '';
        return;
      }
      const [familia, modelo] = selectedValue.split('|');
      familiaSpan.textContent = familia;
      modeloSpan.textContent = modelo;
      detalhesDiv.classList.remove('hidden');
    }

    // Eventos
    marcaSelect.addEventListener('change', atualizarModelos);
    modeloSelect.addEventListener('change', mostrarDetalhes);

    // Inicialização
    preencherMarcas();
